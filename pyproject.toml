[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlia"
version = "0.1.0"
description = "Market & Lead Intelligence Agent: scheduled multi-agent research, lead scoring and broker-ready Excel/CRM output."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mrwan Awad" }]
dependencies = [
  "langgraph>=0.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "google-genai>=1.0",
  "openai>=1.40",
  "anthropic>=0.40",
  "httpx>=0.27",
  "trafilatura>=1.12",
  "ddgs>=9.0",
  "pandas>=2.2",
  "polars>=1.0",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "lightgbm>=4.3",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "xlsxwriter>=3.2",
  "openpyxl>=3.1",
  "apscheduler>=3.10,<4",
  "langfuse>=2.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.5",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mlia = "mlia.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
