services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlia
      POSTGRES_PASSWORD: mlia
      POSTGRES_DB: mlia
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlia"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
